[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "application"
version = "0.6.0"
description = "Lab 06 - Comprehensive Pytest Automation for Banking"
authors = [{ name = "Artem Kyrychenko", email = "zoom.2000v@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "integration: integration tests",
    "unit: unit tests",
    "anyio: marks anyio async tests",
]

[tool.coverage.run]
branch = true
source = [
    "application",
    "shop",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
