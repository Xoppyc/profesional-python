[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-perf"
version = "0.9.0"
description = "Lab 09 - Performance Profiling and Multiprocessing for Banking"
authors = [{ name = "Artem Kyrychenko", email = "zoom.2000v@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
